name: Deploy docs site (Astro Starlight) to Pages

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'docs-site/**'
      - 'agent/graph.py'
      - 'api/app.py'
      - 'api/routers/**'
      - 'config/providers.yml'
      - 'README.md'
      - 'AGENT_STATE.md'
      - 'BACKLOG.md'
      - 'DEPRECATIONS.md'
      - '.github/workflows/docs-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: docs-site/package-lock.json

      - name: Install
        working-directory: docs-site
        run: npm ci

      - name: Audit npm dependencies
        working-directory: docs-site
        # Plan DEP-01, ADR 0009: one fail-closed gate. `npm run audit:deps` fails on
        # every advisory above `info` that has no dated exception by advisory id in
        # docs-site/npm-audit-exceptions.json, on an expired or stale exception and
        # on a report it cannot explain. Raw `npm audit --audit-level=high` is not
        # run beside it: it cannot except by id, so one advisory with no fixed
        # release would hold this step red forever. No `|| true`, no
        # `continue-on-error`.
        run: npm run audit:deps

      - name: Type-check docs site
        working-directory: docs-site
        run: npm run check

      - name: Install chromium-headless-shell for rehype-mermaid SSR
        working-directory: docs-site
        run: npx --yes playwright install --with-deps chromium-headless-shell

      - name: Build
        working-directory: docs-site
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs-site/dist

  deploy:
    needs: build
    # GitHub Pages is not available on a private repository on this plan, so
    # this job could only ever fail: `actions/deploy-pages` returns 404
    # "Ensure GitHub Pages has been enabled" (run 32783283788). Q1 chose a
    # private repository deliberately, so the deploy is what has to give, not
    # the choice. The build job above still runs on every docs change and
    # still gates on `npm run audit:deps` (the npm advisory gate, ADR 0009),
    # the type-check and the build itself — none of that is skipped, only the
    # publish.
    #
    # A workflow that is permanently red teaches its readers to ignore red,
    # which is the same argument ADR 0008 makes about the pip-audit jobs. This
    # condition turns a guaranteed failure into an honest skip, and it lifts
    # itself the moment the repository goes public — phase E, Q4 — with no
    # edit needed here.
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
