repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.11
    hooks:
      - id: ruff-check
        args: [--fix]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(?:archive/|docs/audits/audit_opus_.*\.md$)
      - id: end-of-file-fixer
        exclude: ^(?:archive/|reports/|vectordb/__init__\.py$)
      - id: check-yaml
        exclude: ^deploy/helm/templates/
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: detect-private-key
        exclude: ^archive/

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-r", "-ll", "-c", "pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]
        # Block commits on Medium+ severity findings only (Low triggers at the
        # CLI level: `bandit -r . -l -c pyproject.toml` for full scan).

  - repo: https://github.com/pypa/pip-audit
    rev: v2.10.0
    hooks:
      - id: pip-audit
        args: ["--strict", "--disable-pip", "--require-hashes", "--timeout", "15", "--progress-spinner", "off", "--cache-dir", ".tmp/pip-audit-cache", "--ignore-vuln", "CVE-2026-45829", "--ignore-vuln", "GHSA-f4j7-r4q5-qw2c", "--ignore-vuln", "CVE-2025-3000", "--ignore-vuln", "CVE-2026-45830", "--ignore-vuln", "CVE-2026-45833", "--ignore-vuln", "CVE-2026-45831", "-r", "requirements.lock"]
        files: ^(?:requirements(?:-dev)?\.(?:txt|lock)|\.pre-commit-config\.yaml)$
        pass_filenames: false
        # Audit the generated lock only. requirements.txt is intentionally
        # loose and sends pip-audit through pip resolution. Use a repo-local
        # ignored cache to avoid hangs in the default pip cache location.
        # CVE-2026-45829/GHSA-f4j7-r4q5-qw2c has no fixed ChromaDB release yet;
        # the app does not expose the affected Chroma server API.
        # CVE-2025-3000 (torch): local memory corruption in torch.jit.script,
        # no fixed release as of 2026-06-12. torch is used only for local
        # sentence-transformers inference; torch.jit.script is never fed
        # untrusted input. Drop this ignore once an upstream fix ships.
        # CVE-2026-45830, CVE-2026-45833, CVE-2026-45831 (chromadb): ignored
        # from 2026-08-25, none with a fix version — 1.5.9 is the latest
        # chromadb release on PyPI (re-checked 2026-08-25 and 2026-09-24), so
        # there is nothing to upgrade to. Accepted under ADR 0008, whose
        # conditions are mandatory: by CVE id only, never a blanket ignore on
        # the package, never dropping --strict, so a new chromadb advisory still
        # fails this hook. Reviewed 2026-09-24: still no fixed release.
        # NEXT REVIEW 2026-10-24: re-check for a fixed release; if one exists,
        # upgrade and delete these three entries.
        # Keep this list in sync with the security job in
        # .github/workflows/ci.yml.
